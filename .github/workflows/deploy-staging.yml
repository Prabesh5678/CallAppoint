name: Deploy Staging Frontend

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/deploy-staging.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Pub Get
        working-directory: client
        run: flutter pub get

      - name: Build Flutter Web (Staging)
  working-directory: client
  run: |
    flutter build web --release \
      --dart-define=API_URL=https://call-appoint-staging.azurewebsites.net/api \
      --dart-define=WS_URL=wss://call-appoint-staging.azurewebsites.net \
      --dart-define=SUPABASE_URL=https://gcbgaftpqyhdiizmxpjh.supabase.co \
      --dart-define=SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjYmdhZnRwcXloZGlpem14cGpoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU3NzE5NTYsImV4cCI6MjEwMTM0Nzk1Nn0.30qVS5Blqz2TFUlfoT_4svWOL8toGB5jp58j2ASUH8w

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_STAGING_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "client/build/web"
          output_location: ""
          skip_app_build: true