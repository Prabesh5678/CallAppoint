# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - call-appoint

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/master_call-appoint.yml'
  workflow_dispatch:

jobs:
  build: 
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create and Start virtual environment and Install dependencies
        working-directory: ./server
        run: |
          python -m venv antenv
          source antenv/bin/activate
          pip install -r requirements.txt

      - name: Collect static files
        working-directory: ./server
        env:
          DJANGO_SECRET_KEY: "build-time-placeholder"
          DEBUG: "False"
          ALLOWED_HOSTS: "call-appoint.azurewebsites.net"
          SUPABASE_URL: "https://placeholder.supabase.co"
          SUPABASE_ANON_KEY: "placeholder"
          SUPABASE_SERVICE_ROLE_KEY: "placeholder"
          SUPABASE_DB_NAME: "postgres"
          SUPABASE_DB_USER: "placeholder"
          SUPABASE_DB_PASSWORD: "placeholder"
          SUPABASE_DB_HOST: "placeholder.supabase.co"
          SUPABASE_DB_PORT: "5432"
          KHALTI_SECRET_KEY: "placeholder"
          FIREBASE_CREDENTIALS_JSON: '{"type": "service_account", "project_id": "build-placeholder", "private_key_id": "abcd1234bcae", "private_key": "-----BEGIN PRIVATE KEY-----\nMIIEvwIBADANBgkqhkiG9w0BAQEFAASCBKkwggSlAgEAAoIBAQC7\n-----END PRIVATE KEY-----\n", "client_email": "placeholder@build-placeholder.iam.gserviceaccount.com"}'
        run: |
          source antenv/bin/activate
          python manage.py collectstatic --noinput

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            server
            !server/antenv

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Show OIDC Claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('api://AzureADTokenExchange');
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64').toString()
            );

            console.log("===== OIDC TOKEN CLAIMS =====");
            console.log("Subject:", payload.sub);
            console.log("Repository:", payload.repository);
            console.log("Repository ID:", payload.repository_id);
            console.log("Repository Owner:", payload.repository_owner);
            console.log("Repository Owner ID:", payload.repository_owner_id);
            console.log("Ref:", payload.ref);
            console.log("Workflow Ref:", payload.job_workflow_ref);
            console.log("=============================");
            console.log(JSON.stringify(payload, null, 2));

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_390785EC87A543BBB10DC63CAFDC65DD }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_77A0426F04A248789AD667303F974084 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AB3384CC26CA4EF6B778A1B0734D11F7 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: call-appoint
          slot-name: Production