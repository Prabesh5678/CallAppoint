name: Deploy Production Frontend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Pub Get
        working-directory: client
        run: flutter pub get

      - name: Build Flutter Web (Production)
        working-directory: client
        run: |
          flutter build web --release \
            --dart-define=API_URL=https://call-appoint.azurewebsites.net/api \
            --dart-define=WS_URL=wss://call-appoint.azurewebsites.net \
            --dart-define=SUPABASE_URL=https://oowtlsxswfunufarhnpn.supabase.co \
            --dart-define=SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9vd3Rsc3hzd2Z1bnVmYXJobnBuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1MjU1ODEsImV4cCI6MjA5OTEwMTU4MX0.LGec5R29z1QU9QGL0w0EUrpMeKxS2zKTeoNK1aMFsgc

      - name: Deploy to Azure Static Web Apps    
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "client/build/web"
          output_location: ""
          skip_app_build: true