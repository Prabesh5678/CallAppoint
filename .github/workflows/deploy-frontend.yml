name: Deploy Production Frontend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter Pub Get
        working-directory: client
        run: flutter pub get

      - name: Build Flutter Web (Production)
        working-directory: client
        run: |
          flutter build web --release \
            --dart-define=API_URL=https://call-appoint.azurewebsites.net/api \
            --dart-define=WS_URL=wss://call-appoint.azurewebsites.net

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_PRODUCTION_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "client/build/web"
          output_location: ""
          skip_app_build: true